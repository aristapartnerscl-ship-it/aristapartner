<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/arista-app-icon-v2-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/arista-app-icon-v2-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/arista-app-icon-v2-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/arista-app-icon-v2-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        if (!window.location.pathname.startsWith('/admin')) return
        const saved = window.localStorage.getItem('arista-admin-theme')
        const theme = saved === 'dark' || saved === 'light'
          ? saved
          : (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.adminTheme = theme
      })()
    </script>
    <title>Arista Partners | Representación & Desarrollo Comercial</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
